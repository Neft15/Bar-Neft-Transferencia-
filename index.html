<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111111"><meta name="description" content="Datos de transferencia bancaria de Bar Neft"><title>Transferencias | Bar Neft</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#342a18,#111 58%);color:#fff;min-height:100vh;padding:30px 16px}.wrap{max-width:510px;margin:auto}.header{text-align:center;margin:12px 0 30px}.brand{font-family:Georgia,serif;font-size:clamp(46px,12vw,68px);letter-spacing:2px;color:#d4af37;margin:0}.eyebrow{font-size:12px;letter-spacing:2.5px;color:#e5c77c;margin:9px 0}.line{height:1px;background:linear-gradient(90deg,transparent,#b99745,transparent);margin:22px auto;max-width:290px}.field{background:#242424;border:1px solid #45402f;border-radius:13px;padding:14px 15px;margin:11px 0}.field label{display:block;font-size:12px;color:#c3c3c3;margin-bottom:8px}.value-row{display:flex;align-items:center;gap:8px;justify-content:space-between}.value{font-size:15px;font-weight:600;overflow-wrap:anywhere}button{border:1px solid #b99745;background:transparent;color:#e7ca7b;border-radius:9px;padding:10px 12px;white-space:nowrap;font-size:13px;font-weight:600;cursor:pointer}button:active{background:#4b3c1f}.footer{text-align:center;color:#d4af37;font-size:13px;margin:29px 0 10px}.note{text-align:center;color:#aaa;font-size:12px;line-height:1.5}#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d4af37;color:#111;padding:10px 18px;border-radius:9px;font-weight:700;display:none;box-shadow:0 6px 20px #0008}
</style></head><body><main class="wrap"><header class="header"><h1 class="brand">BAR NEFT</h1><p class="eyebrow">DATOS PARA TRANSFERENCIA</p><div class="line"></div></header><section aria-label="Datos bancarios" id="fields"></section><p class="footer">Gracias por preferir Bar Neft</p><p class="note">Verifica los datos antes de confirmar tu transferencia en la aplicación de tu banco.</p></main><div id="status" role="status" aria-live="polite">Copiado</div><script>
const data=[['Titular','Alejandro Artal Astudillo'],['RUT','7.579.635-8'],['Banco','Edwards / Chile'],['Tipo de cuenta','Cuenta corriente'],['Número de cuenta','702766001'],['Correo electrónico','alejandroartal1@gmail.com']];const section=document.querySelector('#fields');const status=document.querySelector('#status');let timer;data.forEach(([label,value])=>{const field=document.createElement('div');field.className='field';const name=document.createElement('label');name.textContent=label;const row=document.createElement('div');row.className='value-row';const val=document.createElement('span');val.className='value';val.textContent=value;const btn=document.createElement('button');btn.type='button';btn.textContent='Copiar';btn.setAttribute('aria-label','Copiar '+label);btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(value)}catch(e){const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();if(!ok){alert('Mantén presionado el dato para copiarlo.');return}}status.textContent=label+' copiado';status.style.display='block';clearTimeout(timer);timer=setTimeout(()=>status.style.display='none',1900)});row.append(val,btn);field.append(name,row);section.append(field)});
</script></body></html>
